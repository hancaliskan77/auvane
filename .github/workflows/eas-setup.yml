# Run ONCE (Actions tab > "EAS first-time setup" > Run workflow), after EXPO_TOKEN is in the repository secrets.
# It links the app to the Expo organization, writes the project id and update address into app.json,
# and commits that change to the branch you ran it on.
name: EAS first-time setup
on:
  workflow_dispatch:
    inputs:
      owner:
        description: 'Expo organization slug (the short name in the expo.dev address)'
        required: true

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install app dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: Set the owner in app.json
        working-directory: apps/mobile
        env:
          OWNER: ${{ inputs.owner }}
        run: |
          node -e "
            const fs = require('fs');
            const a = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            a.expo.owner = process.env.OWNER;
            fs.writeFileSync('app.json', JSON.stringify(a, null, 2) + '\n');
          "
      - name: Create the EAS project and configure updates
        working-directory: apps/mobile
        run: |
          eas whoami
          eas init --force --non-interactive
          eas update:configure --non-interactive
      - name: Commit app.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/app.json
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "Link app to Expo project (EAS setup)"
          git push
