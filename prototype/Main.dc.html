<div style="display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; flex-direction: column; gap: 6px">

<input id="bt" type="time" style="box-sizing: border-box; height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid #5A4D45; background: #453B33; color: #F0E6DC; font-size: 16px; font-family: inherit; color-scheme: dark">

<div role="option" style="padding: 10px 14px; font-size: 14px; border-top: 1px solid #453B33"><div>Brooklyn Park</div><div style="font-size: 12px; color: #BDAFA9">Minnesota, United States</div></div>
<div role="option" style="padding: 10px 14px; font-size: 14px; border-top: 1px solid #453B33"><div>Brookline</div><div style="font-size: 12px; color: #BDAFA9">Massachusetts, United States</div></div>
</div>
